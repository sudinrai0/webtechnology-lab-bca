  <title>frameset tutorial</title>
  <frameset cols="30%,*">
    
      <frameset rows="20%,*">
        <frame src="frame1.html">
        <frame src="frame2.html">
      </frameset>
    
      <frameset rows="*,*">
        <frameset cols="*,*">
    
        <frame src="frame3.html">
        <frame src="frame4.html">
          </frameset>
      <frameset cols="*,*,*">
        <frame src="frame5.html">
          <frame src="frame6.html">
            <frame src="frame7.html">

           
      </frameset>
      </frameset>
      </frameset>
    
      
  </frameset>
</head>
